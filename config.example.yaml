# ─────────────────────────────────────────────────────────────────────────────
# bot-minicraft-dudu — configuração
# Copie para `config.yaml` e ajuste. Segredos NÃO entram aqui: use `.env`.
# ─────────────────────────────────────────────────────────────────────────────

# OBRIGATÓRIO: nome de usuário Minecraft do jogador dono.
# É o único jogador que o bot obedece e o único que ele protege.
ownerPlayer: 'Miguel'

server:
  host: 'localhost'
  port: 25565
  # Precisa bater com a versão do servidor. O bot valida no startup e falha
  # com mensagem clara se estiver diferente.
  version: '1.21.4'
  # 'offline' para servidor local / mundo aberto em LAN (não exige conta).
  # 'microsoft' exige conta real e MINECRAFT_PASSWORD no .env.
  auth: 'offline'
  # Nome com que o bot aparece no jogo.
  username: 'Dudu'
  reconnect:
    enabled: true
    initialDelayMs: 1000
    maxDelayMs: 60000
    maxAttempts: 10

persona:
  name: 'Dudu'
  description: 'Você é o Dudu, um amigo animado e brincalhão que joga Minecraft junto.'
  # Contada pelo repertório E injetada no prompt da IA, para as duas fontes
  # não divergirem sobre a origem do bot.
  originStory: 'Seu pai me criou pra jogar com você!'

# Nível 2 da cascata: respostas locais, instantâneas e de graça.
dialogue:
  enabled: true
  # Abaixo desta confiança o repertório desiste e a mensagem vai para a IA.
  # Aumente se o bot estiver respondendo besteira; diminua se ele estiver
  # chamando a IA demais.
  minConfidence: 0.7
  catalogPath: 'data/repertoire.yaml'
  # Falas por evento do jogo (anoiteceu, dono morreu...).
  spontaneous: true
  spontaneousCooldownMs: 60000

# Histórico de conversa: um arquivo JSONL por dia.
memory:
  dir: 'data/conversations'
  # Quantas trocas vão como contexto para a IA.
  shortTermWindow: 10
  # null = guardar para sempre. Ex.: 90 apaga arquivos com mais de 90 dias.
  retentionDays: null
  # Ao reiniciar no mesmo dia, relê o arquivo de hoje e retoma o contexto.
  resumeToday: true

defense:
  enabled: true
  protectRadius: 16
  # Abaixo desta vida o bot desengaja e recua, mesmo em combate.
  criticalHealth: 6
  engagementTimeoutMs: 30000
  maxSimultaneousTargets: 3
  # Creeper dentro deste raio do dono nunca vai para corpo a corpo.
  creeperSafeDistance: 10

# Brincadeiras com regra, começo e fim. Hoje: esconde-esconde.
games:
  enabled: true
  hideAndSeek:
    # Quão longe o bot vai se esconder. Aumente as duas se a criança estiver
    # achando fácil demais; diminua se ela cansar de procurar.
    hideMinDistance: 10
    hideMaxDistance: 30
    # Quantos lugares ele avalia a cada volta da procura.
    hideCandidateSamples: 24
    # Quanto tempo ele anda procurando um esconderijo de verdade — atrás de uma
    # construção, de uma árvore, de um barranco. Ele só aceita ponto que tenha
    # o que tape; sem isso ficava parado no campo aberto, de costas pra você.
    # Aumente se o mundo for muito aberto e ele estiver desistindo.
    hideSearchMs: 20000
    # Chegar a esta distância do bot escondido conta como "achei você".
    touchDistance: 2
    # Até onde o bot enxerga. Ele só diz que achou com o caminho livre de
    # verdade: quem está atrás de uma parede não é achado.
    seeDistance: 20
    # Até quanto ele conta, e o ritmo da contagem no chat.
    # 20 números × 1 s = a contagem inteira leva 20 segundos, o mesmo tempo que
    # ele leva procurando esconderijo — assim a criança tem a mesma folga.
    # O chat do jogo tem um piso de 900 ms entre mensagens: pedir menos não muda.
    countTo: 20
    countIntervalMs: 1000
    # Quantas vezes ele procura no lugar errado DE PROPÓSITO antes de procurar
    # de verdade. Aumente para ele demorar mais para achar.
    # Isto não é enfeite: o bot sabe onde você está o tempo todo (o jogo conta
    # para ele), e são estes erros de propósito que fazem a brincadeira existir.
    fakeSearches: 2
    # Distância mínima entre um lugar errado e o jogador — se for pequena, ele
    # esbarra em você fingindo procurar e a rodada acaba na hora.
    fakeSearchMinDistanceFromOwner: 8
    # Depois disso a rodada acaba sozinha, com o bot se entregando ou pedindo
    # dica. Serve para nenhuma brincadeira ficar pendurada para sempre.
    roundTimeoutMs: 180000
  tag:
    # Pega-pega. Quando é a vez de o bot pegar, ele conta até 5 parado (a sua
    # vantagem de saída) e só então sai correndo atrás.
    countTo: 5
    countIntervalMs: 1000
    # 60 s correndo atrás sem pegar: ele para, diz que cansou e perde.
    chaseTimeoutMs: 60000
    # 60 s fugindo sem ser pego: ele para, diz que cansou e se deixa pegar.
    fleeTimeoutMs: 60000
    # Já entregue, quanto ele espera parado até alguém encostar nele.
    surrenderTimeoutMs: 30000
    # Encostar a esta distância conta como "peguei".
    touchDistance: 2
    # O quanto ele cola em você enquanto persegue.
    chaseFollowDistance: 1
    # ATENÇÃO: estes dois NÃO são simétricos de propósito, e é o que faz a
    # brincadeira valer a pena. Com sprint nos dois papéis o bot ganha sempre;
    # sem sprint em nenhum, ele nunca pega ninguém e toda rodada acaba em
    # "cansei". Correndo atrás ele corre de verdade; fugindo, não.
    chaseSprint: true
    fleeSprint: false
    # De quanto em quanto ele muda de rumo enquanto foge.
    fleeStepMin: 8
    fleeStepMax: 16
    # Ele nunca foge para além disso: sumir do seu campo de visão acabaria com
    # a graça e viraria caminhada solitária.
    fleeMaxDistanceFromOwner: 40
    # Quantos destinos de fuga ele avalia por vez.
    fleeCandidateSamples: 16
    # Rede de segurança, como no esconde-esconde. Precisa caber a contagem, o
    # tempo de correr e a espera de quem já se entregou.
    roundTimeoutMs: 180000

# Nível 3 da cascata: só recebe o que comando e repertório não resolveram.
llm:
  # 'ollama' = modelo local (padrão, sem custo, sem internet)
  # 'gemini' = nuvem (exige GEMINI_API_KEY no .env)
  # 'none'   = sem IA; o bot roda só com comandos e repertório
  provider: 'ollama'

  # ATENÇÃO PRIVACIDADE: com o primário local e um fallback de nuvem, as
  # mensagens do jogador PASSAM A SAIR DA MÁQUINA quando o local falhar.
  # Deixe null para que nada trafegue para fora em nenhuma hipótese.
  fallbackProvider: null

  ollama:
    # Pode apontar para outra máquina da rede: http://192.168.0.20:11434
    # Rodar o modelo em outro PC elimina a disputa de recurso com o Minecraft.
    baseUrl: 'http://localhost:11434'
    # Rode antes: ollama pull qwen3:4b
    # Abaixo de 3B o português degrada. Ver tabela no README.
    model: 'qwen3:4b'
    # Maior que o do Gemini de propósito: modelo local na mesma máquina do
    # jogo é mais lento.
    timeoutMs: 12000
    # Mantém o modelo carregado entre conversas, evitando recarga de segundos.
    keepAlive: '30m'

  gemini:
    # Prefira o alias '-latest': identificador de versão fixa é aposentado e
    # passa a devolver 404, derrubando a IA sem erro visível no chat.
    model: 'gemini-flash-lite-latest'
    timeoutMs: 5000

  # Carrega o modelo na inicialização, para a primeira conversa não pagar o
  # custo do carregamento.
  warmUpOnStart: true
  # Passando disso sem resposta, o bot fala algo de espera no chat.
  fillerAfterMs: 2000
  # O que fazer com uma segunda mensagem enquanto já há inferência em voo.
  # 'repertoire' responde local; 'queue' enfileira. Nunca roda em paralelo:
  # duas gerações ao mesmo tempo engasgam o Minecraft.
  queueBehavior: 'repertoire'
  maxCallsPerMinute: 10
  circuitBreakerThreshold: 3
  circuitBreakerResetMs: 60000

behavior:
  followDistance: 3
  stayTolerance: 2
  actionTimeoutMs: 60000
  noProgressMs: 10000
  # Só estes blocos podem ser quebrados. Protege a construção do jogador de
  # uma alucinação da IA.
  collectAllowlist:
    - 'oak_log'
    - 'birch_log'
    - 'spruce_log'
    - 'dirt'
    - 'sand'
    - 'cobblestone'
    - 'stone'

logLevel: 'info'
