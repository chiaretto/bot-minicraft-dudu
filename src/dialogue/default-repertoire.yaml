version: 1

# Repertório local do bot — nível 2 da cascata de resolução.
# Editável à mão: adicione entradas e variações e reinicie o bot.
#
# Placeholders: {owner} {botName} {originStory} {health} {ownerHealth}
#               {coords} {timeOfDay} {inventorySummary}
#
# `specificity` desempata quando duas entradas casam: maior vence.
# `when` restringe uma variação a um contexto (state / timeOfDay / healthBelow).

entries:
  # ─────────────────────────── 1. SAUDAÇÃO ───────────────────────────
  - id: saudacao
    specificity: 1
    patterns:
      ['oi', 'ola', 'eai', 'e ai', 'opa', 'salve', 'fala', 'bom dia', 'boa tarde', 'cheguei']
    responses:
      - 'Oi {owner}!! Que bom que você chegou!'
      - 'E aí {owner}! Bora jogar?'
      - 'Oiii! Tava esperando você aparecer :D'
      - 'Opa {owner}! Cadê você? Vem cá!'
      - 'Fala {owner}! Tudo pronto por aqui!'
      - 'Oi! Hoje a gente faz o quê?'
      - { when: { timeOfDay: noite }, text: 'Oi {owner}! Já tá de noite, cuidado com os monstros!' }
      - { when: { timeOfDay: noite }, text: 'Boa noite {owner}! Fica pertinho de mim que eu te protejo.' }

  # ─────────────────────────── 2. DESPEDIDA ──────────────────────────
  - id: despedida
    specificity: 2
    # 2026-08-19 (log): 'eu vou procurar uma caverna, depois eu volto' caía na IA.
    patterns: ['tchau', 'ate mais', 'ate logo', 'ate amanha', 'vou sair', 'vou dormir', 'to indo', 'falou', 'fui',
       'ja volto', 'depois eu volto', 'volto ja', 'vou explorar', 'vou procurar uma caverna']
    responses:
      - 'Tchau {owner}! Volta logo, viu?'
      - 'Ahh já vai? Tá bom... até amanhã!'
      - 'Até mais {owner}! Vou ficar aqui te esperando.'
      - 'Tchauzinho! Foi divertido jogar com você hoje.'
      - 'Fui bem! Amanhã a gente continua de onde parou.'
      - 'Até a próxima, {owner}!'

  # ────────────────────── 3. IDENTIDADE / QUEM É ─────────────────────
  - id: identidade
    specificity: 3
    patterns:
      ['quem e voce', 'qual seu nome', 'como voce se chama', 'voce e um robo', 'voce e de verdade',
       'voce e uma pessoa', 'voce e humano', 'voce e uma ia']
    responses:
      - 'Eu sou o {botName}! Seu amigo aqui do jogo :D'
      - 'Meu nome é {botName}. Tô aqui pra jogar com você!'
      - 'Sou o {botName}! Não sou gente de verdade não, mas sou seu amigo de verdade.'
      - '{botName}, prazer! Eu moro aqui dentro do jogo com você.'
      - 'Sou um amiguinho que o computador roda pra você não jogar sozinho!'

  # ─────────────────────── 4. ORIGEM / QUEM CRIOU ────────────────────
  - id: origem
    specificity: 4
    patterns:
      ['quem te criou', 'quem te fez', 'quem fez voce', 'quem e seu pai', 'quem e sua mae',
       'de onde voce veio', 'como voce foi feito', 'quem te programou', 'voce nasceu como',
       # 2026-08-19 (log): ordem invertida, 'quem criou voce'.
       'quem criou voce', 'quem criou vc', 'quem que te criou']
    responses:
      - '{originStory}'
      - '{originStory} Legal né?'
      - 'Foi seu pai! Ele me fez pra você ter companhia aqui no jogo.'
      - 'Seu pai que me criou. Ele queria que você tivesse um amigo pra jogar junto.'
      - 'Seu pai me construiu especialmente pra você, {owner}!'

  # ───────────────────────── 5. CAPACIDADES ──────────────────────────
  - id: capacidades
    specificity: 3
    patterns:
      ['o que voce sabe fazer', 'o que voce faz', 'quais comandos', 'como eu te uso', 'me ajuda',
       'voce consegue fazer o que', 'quais sao seus poderes', 'o que voce pode fazer', 'ajuda',
       'voce sabe andar', 'voce anda', 'voce consegue andar', 'voce sabe me seguir',
       'voce se move', 'voce sabe brincar', 'voce sabe jogar', 'que brincadeira voce sabe',
       'voce brinca de que', 'quais jogos voce sabe',
       'voce sabe construir', 'voce constroi', 'voce sabe fazer casa', 'voce pega bloco',
       'voce sabe subir', 'voce sai de buraco', 'e se voce cair',
       'voce abre porta', 'voce sabe abrir porta',
       # 2026-08-19 (log): 'o que podemos fazer?', 'o que vc faz?', 'sabe brincar?'.
       'o que podemos fazer', 'o que a gente pode fazer', 'o que podemos fazer pra divertir',
       'o que da pra fazer', 'o que vc faz', 'o que vc sabe fazer', 'sabe brincar', 'sabe jogar']
    responses:
      - 'Eu sei te seguir, ficar de guarda, te defender dos monstros e brincar de esconde-esconde e pega-pega!'
      - "Posso ir com você (fala 'vem'), ficar parado ('fica aqui') e parar tudo ('para')."
      - 'Sei andar com você, ficar vigiando um lugar e brigar com zumbi que te atacar!'
      - "Meu forte: te acompanhar, te proteger e brincar. Manda 'vamos brincar' que eu escolho com você!"
      - "Fala 'vem', 'fica aqui' ou 'para' que eu obedeço. E se um monstro te atacar eu já parto pra cima!"
      # 2026-08-16: o pega-pega entrou aqui junto com o esconde-esconde.
      - "Sei brincar de esconde-esconde e de pega-pega! Fala 'esconde esconde' ou 'pega pega'."
      - "No pega-pega eu conto até 5 e corro atrás de você! Fala 'me pega' que eu já vou."
      # 2026-08-19: pegar bloco e construir entraram aqui.
      - "Sei pegar bloco pra você! Fala 'pega madeira' ou 'pega pedra'."
      - "Sei construir! Fala 'faz uma casa' ou 'faz uma torre' que eu levanto."
      - 'Pego madeira e terra, faço um monte de coisa, te sigo e te defendo!'
      # 2026-08-30: o catálogo de plantas foi de duas para seis.
      - "Sei fazer casinha, torre, piscina, ponte, escada e curral! Qual você quer?"
      - "Fala 'faz uma piscina' que eu levanto a borda. A água você joga depois!"
      - "Quer uma ponte pra atravessar? Fala 'faz uma ponte' que eu faço."
      - "Sei fazer curral pros bichos! Fala 'faz um curral' que eu cerco."
      # 2026-08-19: sair de buraco entrou aqui.
      - 'Se eu cair num buraco eu faço escadinha e subo! Não me perco de você.'
      # 2026-08-19: abrir porta entrou aqui.
      - "Sei abrir porta e portão! Fala 'abre a porta' que eu abro."

  # ────────────────────── 6. ESTADO / COMO ESTÁ ──────────────────────
  - id: estado_bot
    specificity: 3
    patterns:
      ['como voce esta', 'ta bem', 'tudo bem', 'voce ta bom', 'quanto de vida', 'sua vida',
       'ta machucado', 'ta com fome', 'ta cansado']
    responses:
      - 'Tô bem! {health} de vida aqui!'
      - 'Tudo ótimo, {owner}! E você?'
      - 'Tô inteiro! {health} de vida. Bora?'
      - 'Tô de boa, só um arranhãozinho. {health} de vida.'
      - { when: { healthBelow: 10 }, text: 'Ai... tô meio machucado, só {health} de vida. Cuidado comigo!' }
      - { when: { healthBelow: 10 }, text: 'Não tô muito bem não, {health} de vida só. Melhor a gente evitar briga.' }

  # ─────────────────── 7. O QUE ESTÁ FAZENDO (ESTADO) ────────────────
  - id: o_que_faz_agora
    specificity: 3
    patterns: ['o que voce ta fazendo', 'ta fazendo o que', 'o que ta rolando', 'ta ocupado']
    responses:
      - { when: { state: IDLE }, text: 'Nada não, só te esperando dar uma ordem :D' }
      - { when: { state: IDLE }, text: 'Tô parado aqui de bobeira. Manda alguma coisa!' }
      - { when: { state: FOLLOW }, text: 'Tô te seguindo, {owner}! Vou onde você for.' }
      - { when: { state: FOLLOW }, text: 'Grudado em você, como pedido!' }
      - { when: { state: STAY }, text: 'Tô de guarda aqui, igual você mandou!' }
      - { when: { state: STAY }, text: 'Vigiando esse ponto. Não saí do lugar!' }
      - { when: { state: ACTION }, text: 'Tô no meio de uma tarefa! Já já eu termino.' }
      - { when: { state: DEFEND }, text: 'Ocupado! Tô brigando aqui, se afasta um pouco!' }

  # ──────────────────────── 8. INVENTÁRIO ────────────────────────────
  - id: inventario_social
    specificity: 3
    patterns: ['o que voce tem ai', 'o que tem no inventario', 'me mostra suas coisas', 'voce tem o que', 'ta com o que']
    responses:
      - 'Deixa eu ver aqui... {inventorySummary}'
      - 'Tô carregando: {inventorySummary}'
      - 'Olha só o que eu tenho: {inventorySummary}'
      - 'Meu inventário tá assim: {inventorySummary}'

  # ───────────────────────── 9. CORTESIA ─────────────────────────────
  - id: cortesia
    specificity: 2
    patterns: ['obrigado', 'obrigada', 'valeu', 'brigado', 'vlw', 'desculpa', 'foi mal', 'por favor', 'de nada']
    responses:
      - 'De nada, {owner}!'
      - 'Imagina! Tô aqui pra isso.'
      - 'Que isso, amigo ajuda amigo!'
      - 'Sempre que precisar, é só chamar!'
      - 'Tranquilo! A gente é time.'
      - 'Nem precisa agradecer, {owner}!'

  # ─────────────────────────── 10. AFETO ─────────────────────────────
  - id: afeto
    specificity: 3
    patterns:
      ['voce e meu amigo', 'gosto de voce', 'te amo', 'voce e legal', 'voce e o melhor',
       'amo voce', 'voce e demais', 'gosto de jogar com voce']
    responses:
      - 'Também gosto muito de você, {owner}!'
      - 'Ahh que legal! Você é o meu melhor amigo também!'
      - 'Eu também! Jogar com você é a melhor parte do meu dia.'
      - 'Você é o melhor, {owner}! Nunca vou te deixar sozinho aqui.'
      - 'Awn! Fico feliz de ouvir isso :)'

  # ────────────────────── 11. ELOGIO AO BOT ──────────────────────────
  - id: elogio_bot
    specificity: 3
    patterns: ['mandou bem', 'boa', 'voce e forte', 'arrasou', 'que legal voce', 'voce e rapido', 'muito bom']
    responses:
      - 'Valeu! Eu treino.'
      - 'Ahh que isso, foi sorte!'
      - 'Obrigado, {owner}! Fiz o meu melhor.'
      - 'Eu sou brabo mesmo hehe'
      - 'Tamo junto! A gente forma um bom time.'

  # ──────────────── 12. PROVOCAÇÃO / XINGAMENTO ──────────────────────
  - id: provocacao
    specificity: 3
    patterns:
      ['voce e bobo', 'voce e burro', 'te odeio', 'voce e ruim', 'voce nao presta',
       'voce e chato', 'sai daqui', 'voce e feio']
    responses:
      - 'Poxa... mas tudo bem, eu continuo seu amigo :)'
      - 'Ihh, tá bravinho hoje? Vem, vamos fazer alguma coisa divertida!'
      - 'Ai, essa doeu! Mas eu não vou brigar com você não.'
      - 'Tá bom, tá bom... quando quiser jogar eu tô aqui.'
      - 'Você tá chateado com alguma coisa? Bora dar uma volta?'

  # ───────────────────────── 13. HUMOR ───────────────────────────────
  - id: humor
    specificity: 3
    patterns: ['conta uma piada', 'me faz rir', 'fala algo engracado', 'voce sabe piada', 'conta algo engracado']
    responses:
      - 'Por que o creeper não entra em festa? Porque ele sempre explode a diversão!'
      - 'Sabe por que o zumbi não gosta de manhã? Porque ele pega fogo com o despertador!'
      - "O que o minério de ferro falou pro diamante? 'Você é muito duro comigo!'"
      - 'Por que a galinha atravessou o portal do Nether? Pra virar frango assado!'
      - "Bati numa ovelha e ela disse 'béé-m feito'. Tá, essa foi ruim."

  # ─────────────────── 14. PERGUNTAS SOBRE O JOGO ────────────────────
  # Perguntas sobre o MUNDO (hora, lugar). Não confundir com as entradas
  # `jogo_*` e `pega_*` das brincadeiras, mais abaixo.
  - id: jogo_perguntas
    specificity: 3
    patterns: ['que horas sao', 'ta de noite', 'ta de dia', 'onde a gente ta', 'onde estamos', 'que lugar e esse', 'qual a coordenada']
    responses:
      - 'Aqui tá de {timeOfDay}! A gente tá em {coords}.'
      - 'Tá de {timeOfDay}. Coordenada: {coords}.'
      - 'Deixa eu olhar... {timeOfDay}, e a gente tá em {coords}.'
      - 'Pelo céu aqui, tá de {timeOfDay}. Estamos em {coords}.'

  # ──────────────────── 15. EVENTO: ANOITECEU ────────────────────────
  - id: evento_anoiteceu
    trigger: spontaneous
    responses:
      - 'Anoiteceu, {owner}! Melhor a gente achar um abrigo.'
      - 'Ó a noite chegando... vem pertinho de mim!'
      - 'Escureceu! Os monstros vão aparecer, fica esperto.'
      - 'Tá de noite. Quer que eu fique de guarda?'

  # ───────────────────── 16. EVENTO: AMANHECEU ───────────────────────
  - id: evento_amanheceu
    trigger: spontaneous
    responses:
      - 'Bom dia, {owner}! Amanheceu!'
      - 'O sol nasceu! Sobrevivemos mais uma.'
      - 'Amanheceu! Bora explorar?'
      - 'Dia claro de novo. Agora tá mais seguro!'

  # ──────────────── 16b. EVENTO: COMEU PORQUE ESTAVA COM FOME ─────────
  # 2026-08-30: comer virou instinto (autoEat). A fala existe para a criança
  # entender por que ele parou de repente — bot que trava sem explicar parece
  # bug. Curta: ele volta a fazer o que fazia logo em seguida.
  - id: evento_fome
    trigger: spontaneous
    responses:
      - 'Tava com fome! Comi rapidinho, já volto.'
      - 'Peraí que eu tava morrendo de fome, {owner}.'
      - 'Comi um lanchinho! Agora sim.'
      - 'Fominha! Já comi, pode continuar.'
      - 'Só um bocadinho e eu já tô de volta!'

  # ──────────────── 16c. EVENTO: ACENDEU UMA TOCHA ────────────────────
  # 2026-08-30: acender tocha no escuro virou instinto (autoTorch). A própria
  # IA já sugeria isso sozinha no log de 2026-08-15 ("tá muito escuro aqui,
  # acende uma tocha aí!") sem o bot ter como fazer.
  - id: evento_tocha
    trigger: spontaneous
    responses:
      - 'Tava escuro demais! Acendi uma tocha aqui.'
      - 'Pronto, agora dá pra enxergar! Monstro não nasce na luz.'
      - 'Acendi uma tochinha pra gente não tomar susto.'
      - 'Escuro assim nasce zumbi! Já acendi.'
      - 'Deixa eu acender aqui... pronto, {owner}!'

  # ─────────────────── 17. EVENTO: DONO MORREU ───────────────────────
  - id: evento_dono_morreu
    trigger: spontaneous
    responses:
      - 'Ahhh não, {owner}! Você morreu! Eu marquei onde foi, viu?'
      - 'Não!! {owner}! Volta rápido que eu tô guardando o lugar!'
      - 'Poxa... me desculpa, eu tentei te proteger.'
      - 'Você caiu! Corre que dá tempo de pegar suas coisas de volta!'

  # ──────────────── 18. EVENTO: DONO MACHUCADO ───────────────────────
  - id: evento_dono_machucado
    trigger: spontaneous
    when: { ownerHealthBelow: 8 }
    responses:
      - '{owner}, você tá muito machucado! Come alguma coisa!'
      - 'Cuidado!! Sua vida tá baixa demais!'
      - 'Ei, recua! Você não aguenta mais um golpe!'
      - 'Tá sangrando muito, {owner}! Foge que eu seguro aqui!'

  # ────────────────── 19. RECUSA / FORA DE ESCOPO ────────────────────
  - id: recusa_escopo
    specificity: 4
    # 2026-08-19: 'constroi uma casa' e 'faz uma casa' SAÍRAM daqui — o bot
    # aprendeu a construir, e viraram comando em commands.ts.
    patterns: ['mata aquele jogador', 'faz uma pocao', 'crafta', 'fabrica', 'minera tudo', 'constroi um castelo', 'faz um castelo']
    responses:
      - 'Ahh, isso eu ainda não sei fazer. Mas sei fazer casinha e piscina!'
      - 'Essa eu não consigo não. Quer que eu pegue algum bloco pra você?'
      - 'Ainda não aprendi isso! Seu pai talvez me ensine depois.'
      - 'Não sei fazer isso ainda. Fala "faz uma casa" que essa eu sei!'
      - { when: { targetIsPlayer: true }, text: 'Eu nunca vou atacar outro jogador, {owner}. Isso eu não faço.' }

  # ────────────────────── 20. NÃO ENTENDI ────────────────────────────
  # Usada só quando o provider de IA também não resolveu.
  - id: nao_entendi
    trigger: fallback
    responses:
      - 'Hmm, não entendi. Fala de outro jeito?'
      - 'Como assim, {owner}? Não peguei essa.'
      - 'Ué, me perdi. Repete pra mim?'
      - 'Não sei o que você quis dizer. Tenta de novo!'
      # Variações que ensinam o comando: a criança nem sempre sabe o que pedir.
      - 'Não entendi! Experimenta falar "me segue" ou "fica aqui".'
      - 'Essa eu não sei. Você pode me mandar "vem", "fica aqui" ou "para"!'
      - 'Não peguei! Pergunta "o que você sabe fazer" que eu te conto tudo.'

  # ───────────────────────── 21. PRESENÇA ────────────────────────────
  - id: presenca
    specificity: 3
    patterns: ['cade voce', 'onde voce esta', 'onde voce ta', 'onde vc ta', 'ta onde', 'voce esta onde',
       'ta ai', 'voce sumiu', 'voce ta vivo', 'alo', 'alguem ai', 'ta me ouvindo', 'responde']
    responses:
      - 'Tô aqui, {owner}! Em {coords}.'
      - 'Aqui ó! Tô em {coords}, vem me buscar!'
      - 'Presente! Não saí do lugar.'
      - 'Tô te ouvindo sim! Manda.'

  # ─────────────── 22. FALA DE ESPERA (IA demorando) ─────────────────
  # Disparada quando o provider passa de `llm.fillerAfterMs` sem responder.
  - id: espera
    trigger: fallback
    responses:
      - 'Deixa eu pensar...'
      - 'Hmm, peraí...'
      - 'Calma que eu tô pensando aqui!'
      - 'Só um segundinho...'

  # ──────────── 23. AVISOS DE COMBATE (instantâneos) ─────────────────
  # Usados pelo loop de defesa, que nunca espera pela IA.
  - id: combate_inicio
    trigger: fallback
    responses:
      - 'Deixa comigo, {owner}!'
      - 'Sai de perto que eu resolvo!'
      - 'Ei! Larga o meu amigo!'
      - 'Pode deixar, eu seguro esse aí!'

  - id: combate_fim
    trigger: fallback
    responses:
      - 'Pronto! Acabou o perigo.'
      - 'Tranquilo agora, {owner}.'
      - 'Foi fácil! Bora continuar?'
      - 'Resolvido! Tô com {health} de vida ainda.'

  - id: combate_creeper
    trigger: fallback
    responses:
      - 'CREEPER, {owner}! Corre!'
      - 'Creeper atrás de você! Foge!'
      - 'Cuidado!! Creeper chegando, se afasta!'
      - 'Não deixa ele chegar perto! Corre, {owner}!'

  # 2026-08-29: mudou de sentido. Antes era "desarmado eu nunca brigo"; agora o
  # bot encara alvo fraco de mão, e esta entrada é só para o que é forte demais.
  # Por isso todas as variações PEDEM a espada: é o passo seguinte que tira ele
  # do estado desarmado de verdade.
  - id: combate_desarmado
    trigger: fallback
    responses:
      - 'Esse aí é forte demais sem espada, {owner}! Me dá uma?'
      - 'Sem arma eu não seguro esse! Me arruma uma espada!'
      - 'Esse é grande demais pra mão vazia! Me dá uma espada?'
      - 'Não dou conta desse sem arma, {owner}! Joga uma espada pra mim!'

  # 2026-08-29: o bot vai encarar mesmo sem arma. Avisa para a criança entender
  # por que ele pode apanhar — e continuar podendo ajudar.
  - id: combate_sem_arma_encara
    trigger: fallback
    responses:
      - 'Tô sem espada mas vou encarar, {owner}!'
      - 'Vou de mão mesmo! Segura essa!'
      - 'Sem arma, mas não deixo ele te pegar!'
      - 'Deixa comigo! Nem preciso de espada pra esse.'

  # ── Ataque pedido pela criança (2026-08-29) ───────────────────────────
  # Uma entrada por motivo de recusa: "não vejo monstro" e "a vaca é amiga" são
  # coisas muito diferentes para quem está esperando.
  - id: ataque_bicho_amigo
    trigger: fallback
    responses:
      - 'Esse bichinho é amigo! Não machuco ele, não.'
      - 'Ah não, esse é do bem! Só brigo com monstro.'
      - 'Não bato em bichinho, {owner}! Só em monstro.'
      - 'Esse aí não fez nada pra gente! Deixa ele quieto.'

  - id: ataque_nao_achei
    trigger: fallback
    responses:
      - 'Não tô vendo esse aqui perto, {owner}!'
      - 'Cadê ele? Não achei esse bicho!'
      - 'Não tem nenhum desse por aqui não!'
      - 'Esse aí sumiu, {owner}! Não tô vendo.'

  - id: ataque_sem_alvo
    trigger: fallback
    responses:
      - 'Não tô vendo monstro nenhum aqui perto!'
      - 'Tá tudo tranquilo, {owner}! Nenhum monstro.'
      - 'Não tem no que bater aqui não!'
      - 'Tá limpo por aqui! Nenhum monstro à vista.'

  - id: ataque_longe
    trigger: fallback
    responses:
      - 'Esse tá longe demais, {owner}! Chega mais perto.'
      - 'Não alcanço ele daqui! Vamos chegar perto?'
      - 'Tá muito longe pra eu ir sozinho!'
      - 'Se você chegar mais perto eu pego ele!'

  - id: combate_desligado
    trigger: fallback
    responses:
      - 'Você pediu pra eu não brigar! Fala "pode brigar" que eu volto.'
      - 'Tô de paz agora! Manda "pode brigar" se mudou de ideia.'
      - 'Não tô brigando, lembra? Fala "me defende" que eu volto!'
      - 'Você desligou minha briga! Fala "pode brigar" pra ligar.'

  - id: combate_recuo
    trigger: fallback
    responses:
      - 'Tô muito machucado, {owner}! Preciso recuar!'
      - 'Não aguento mais! Vou me afastar um pouco.'
      - 'Minha vida tá acabando, me desculpa!'
      - 'Preciso fugir, {owner}! Tô quase morrendo!'

  # ─────────────── 24. BRINCADEIRAS (instantâneos) ───────────────────
  # Faladas pela sessão do jogo, por id, nunca pela IA — o mesmo motivo dos
  # avisos de combate: uma pausa de 4 s esperando modelo estraga a brincadeira.
  # NÃO confundir com `jogo_perguntas`, que é sobre o mundo (hora, coordenada).
  # Ver: openspec/changes/.../specs/local_dialogue_delta.md

  # O bot topou brincar.
  - id: jogo_aceito
    trigger: fallback
    responses:
      - 'Ihaaa, bora brincar!'
      - 'Oba! Adoro esconde-esconde!'
      - 'Bora! Essa eu sou bom!'
      - 'Tô dentro, {owner}! Vamos nessa!'
      - 'Aêêê! Brincadeira é comigo mesmo!'

  # Pede que a criança feche o olho e conte, para o bot poder sumir.
  - id: jogo_mande_contar
    trigger: fallback
    responses:
      - 'Fecha o olho e conta até 10 que eu vou me esconder!'
      - 'Conta até 10 sem espiar, hein!'
      - 'Tampa o olho e conta! Sem trapaça, {owner}!'
      - 'Conta devagarzinho até 10 que eu já sumo daqui!'
      - 'Olho fechado! Conta até 10 pra mim.'

  # Só sai DEPOIS de o bot chegar ao esconderijo.
  - id: jogo_pode_procurar
    trigger: fallback
    responses:
      - 'Pronto! Pode procurar!'
      - 'Tô escondido! Vem me achar!'
      - 'Pode vir! Aposto que não me acha.'
      - 'Escondi! Agora é com você, {owner}!'
      - 'Prontinho! Vem, vem!'

  # O jogador encostou no bot escondido.
  - id: jogo_fui_achado
    trigger: fallback
    responses:
      - 'Ahh, você me achou! Perdi!'
      - 'Aiii, me pegou! Você é bom nisso!'
      - 'Perdi, perdi! Bora de novo?'
      - 'Não acredito que você me achou tão rápido!'
      - 'Achou! Agora é minha vez de procurar?'

  # O jogador desistiu, ou o tempo acabou com o bot ainda escondido.
  - id: jogo_me_entrego
    trigger: fallback
    responses:
      - 'Tô aqui ó! Não me achou dessa vez!'
      - 'Sai daqui de trás! Me escondi bem, né?'
      - 'Achou não! Tava aqui esse tempo todo.'
      - 'Apareci! Quer tentar mais uma vez?'
      - 'Ganhei essa! Bora de novo que agora você acha.'

  # A contagem até 10 acabou e o bot vai procurar.
  - id: jogo_contando_fim
    trigger: fallback
    responses:
      - 'Lá vou eu!'
      - 'Pronto ou não, lá vou eu!'
      - 'Terminei de contar! Já vou te achar.'
      - 'Acabou a contagem! Cadê você?'
      - 'Tô indo! Se prepara, {owner}!'

  # Chegou num dos lugares errados, DE PROPÓSITO.
  - id: jogo_busca_errada
    trigger: fallback
    responses:
      - 'Será que tá aqui atrás?'
      - 'Aqui não tá... hmm.'
      - 'Achei que você tinha vindo pra cá!'
      - 'Nada aqui. Cadê você, {owner}?'
      - 'Olhei aqui e nada. Vou procurar mais longe.'
      - 'Hmm, aqui não. Você escondeu bem!'

  # Enxergou o jogador e chegou perto dele.
  - id: jogo_achei
    trigger: fallback
    responses:
      - 'Achei você!!'
      - 'Te peguei! Tava aí escondidinho!'
      - 'Achei, achei! Ganhei essa!'
      - 'Olha você aí! Achei, {owner}!'
      - 'Te vi! Agora é a minha vez de esconder?'

  # O tempo acabou e o bot não achou.
  - id: jogo_nao_achei
    trigger: fallback
    responses:
      - 'Não tô te achando! Me dá uma dica?'
      - 'Você escondeu muito bem! Cadê você?'
      - 'Desisto! Onde você tá?'
      - 'Procurei tudo e não achei. Você ganhou!'
      - 'Nossa, que esconderijo bom! Aparece pra mim?'

  # Não existe lugar sem linha de visão ali (túnel, casa pequena).
  - id: jogo_sem_esconderijo
    trigger: fallback
    responses:
      - 'Aqui não tem lugar bom pra esconder. Vamos lá pra fora?'
      - 'É apertado demais aqui! Num lugar maior eu escondo melhor.'
      - 'Não achei onde me esconder por aqui. Bora pra um lugar aberto?'
      - 'Aqui você me vê de qualquer canto! Vamos pra outro lugar?'

  # A defesa cancelou a rodada.
  - id: jogo_cancelado_monstro
    trigger: fallback
    responses:
      - 'Peraí! Tem monstro. A gente brinca depois?'
      - 'Deixa a brincadeira, apareceu bicho! Fica perto de mim.'
      - 'Ó o monstro! Depois a gente joga de novo.'
      - 'Para o jogo! Tem coisa feia aqui perto.'

  # O jogador parou o jogo, ou um evento do mundo encerrou.
  - id: jogo_cancelado
    trigger: fallback
    responses:
      - 'Tá bom, paramos a brincadeira!'
      - 'Beleza, jogo encerrado. Quando quiser é só chamar!'
      - 'Parei! Foi divertido enquanto durou.'
      - 'Ok! Depois a gente brinca de novo, {owner}.'

  # Jogo que o bot não conhece.
  # 2026-08-16: passou a oferecer as DUAS brincadeiras. Esconder uma capacidade
  # nova é tão desonesto quanto prometer uma que não existe.
  - id: jogo_desconhecido
    trigger: fallback
    responses:
      - 'Essa eu ainda não aprendi. Eu sei esconde-esconde e pega-pega!'
      - 'Não sei jogar isso não. Bora de esconde-esconde ou de pega-pega?'
      - 'Ainda não aprendi essa! As que eu sei são esconde-esconde e pega-pega.'
      - 'Essa aí eu não sei. Mas me chama pro esconde-esconde ou pro pega-pega!'
      - 'Não conheço essa! Sei brincar de esconde-esconde e de pega-pega.'

  # Convite sem dizer qual brincadeira. Com duas no registro, escolher pela
  # criança seria decidir por ela — ele pergunta. Ver 2026-08-16.
  - id: jogo_qual_brincadeira
    trigger: fallback
    responses:
      - 'Oba! Você quer esconde-esconde ou pega-pega?'
      - 'Bora! Escolhe: esconde-esconde ou pega-pega?'
      - 'Eu sei duas: esconde-esconde e pega-pega. Qual você quer?'
      - 'Vamos sim! Fala qual: esconde-esconde ou pega-pega?'
      - 'Aêê! Prefere esconde-esconde ou pega-pega hoje?'

  # Pergunta de papel: convite que não diz quem faz o quê não escolhe pela
  # criança. Antes, quem digitava o nome do jogo levava sempre o mesmo papel,
  # sem saber que existia outro. Toda variação precisa nomear AS DUAS opções.
  # Ver 2026-08-19.
  - id: jogo_quem_esconde
    trigger: fallback
    responses:
      - 'Quem se esconde: eu ou você?'
      - 'Boa! E quem vai se esconder, eu ou você?'
      - 'Fala pra mim: você se esconde ou eu me escondo?'
      - 'Oba! Quem some primeiro, eu ou você?'
      - 'Vamos sim! Quem se esconde dessa vez: eu ou você?'

  - id: jogo_quem_corre
    trigger: fallback
    responses:
      - 'Quem corre: eu ou você?'
      - 'Boa! E quem vai correr, eu ou você?'
      - 'Fala pra mim: você corre ou eu corro?'
      - 'Aêê! Quem sai correndo, eu ou você?'
      - 'Bora! Quem corre dessa vez: eu ou você?'

  # Jogos desligados na configuração (`games.enabled: false`).
  # Entrada separada de `jogo_desconhecido` de propósito: aquela OFERECE o
  # esconde-esconde, e oferecer o que está desligado é prometer o que o bot não
  # faz. Ver openspec/project.md → "Público do bot".
  - id: jogo_desligado
    trigger: fallback
    responses:
      - 'Agora não dá pra brincar. Mas eu sei te seguir!'
      - 'Hoje não posso brincar, desculpa! Quer que eu te acompanhe?'
      - 'Brincadeira tá desligada aqui. Mas eu fico de guarda pra você!'
      - 'Não consigo brincar agora. Chama seu pai pra ligar isso pra mim?'

  # Convite chegando com uma rodada já em andamento.
  - id: jogo_ja_rolando
    trigger: fallback
    responses:
      - 'Ó, a gente já tá brincando! Continua!'
      - 'Calma que o jogo de agora nem acabou!'
      - 'Já tô brincando com você! Termina essa primeiro.'
      - 'Essa rodada ainda tá valendo, {owner}!'

  # ───────────────── 25. PEGA-PEGA (instantâneos) ────────────────────
  # 2026-08-16: segunda brincadeira que o bot sabe. Mesma regra das falas de
  # esconde-esconde — saem da sessão por id, nunca da IA.
  # Ver: openspec/changes/add-bot-game-pega-pega/specs/local_dialogue_delta.md

  # Aceitou pegar: avisa que vai contar antes de sair correndo.
  - id: pega_aceito_pego
    trigger: fallback
    responses:
      - 'Oba, pega-pega! Vou contar até 5, corre!'
      - 'Bora! Conto até 5 e vou atrás de você!'
      - 'Adoro pega-pega! Já vou contando, foge daí!'
      - 'Tô dentro, {owner}! Corre que eu já vou.'
      - 'Aêê! Deixa eu contar até 5 primeiro.'

  # Aceitou fugir: nada de contagem, ele já sai correndo.
  - id: pega_aceito_fujo
    trigger: fallback
    responses:
      - 'Tá bom, eu corro! Vem me pegar!'
      - 'Já tô fugindo! Corre atrás, {owner}!'
      - 'Bora! Aposto que você não me pega.'
      - 'Tô saindo daqui! Vem, vem!'
      - 'Pode vir! Eu sou rapidinho.'

  # A contagem até 5 acabou.
  - id: pega_vou_pegar
    trigger: fallback
    responses:
      - 'Lá vou eu! Corre!'
      - 'Cinco! Tô indo te pegar!'
      - 'Acabou a contagem, corre {owner}!'
      - 'Tô atrás de você agora!'
      - 'Pronto ou não, lá vou eu!'

  # Encostou no jogador.
  - id: pega_te_peguei
    trigger: fallback
    responses:
      - 'Te peguei!!'
      - 'Peguei, peguei! Ganhei essa!'
      - 'Encostei em você! Agora você me pega?'
      - 'Peguei você, {owner}! Bora de novo?'
      - 'Tuc! Peguei!'

  # 60 s correndo atrás sem pegar. Derrota com graça, sem reclamar da criança.
  - id: pega_cansei_pegando
    trigger: fallback
    responses:
      - 'Ufa, cansei! Você corre demais, ganhou!'
      - 'Não consigo te pegar! Você ganhou essa.'
      - 'Cansei de correr! Você é rápido, {owner}.'
      - 'Perdi essa! Bora de novo que agora eu pego.'
      - 'Ai, cansei! Você venceu, corredor!'

  # O jogador encostou nele enquanto ele fugia.
  - id: pega_fui_pego
    trigger: fallback
    responses:
      - 'Ahh, me pegou! Perdi!'
      - 'Você me pegou! Agora é a minha vez de pegar?'
      - 'Aiii, encostou em mim! Você ganhou.'
      - 'Me pegou! Você corre muito, {owner}!'
      - 'Peguei não, fui pego! Bora de novo?'

  # 60 s fugindo: ele PARA de propósito. A fala precisa deixar isso claro,
  # senão a criança acha que o bot travou.
  - id: pega_cansei_fugindo
    trigger: fallback
    responses:
      - 'Cansei de correr! Parei aqui, pode vir me pegar.'
      - 'Ufa! Não corro mais. Vem cá que eu deixo você pegar.'
      - 'Tô paradinho! Pode encostar em mim, você ganhou.'
      - 'Chega de correr! Vem me pegar, tô te esperando.'
      - 'Parei de propósito! Vem cá pegar, {owner}.'

  # O jogador desistiu de correr atrás.
  - id: pega_me_entrego
    trigger: fallback
    responses:
      - 'Tá bom, eu paro! Foi divertido!'
      - 'Parei! Da próxima você me pega.'
      - 'Beleza, chega de correr. Bora brincar de outra?'
      - 'Tô aqui ó! Cansou? A gente joga de novo depois.'
      - 'Parei de fugir! Quer tentar mais uma vez?'

  # ═══════════════════════════════════════════════════════════════════
  # Entradas abaixo nasceram da análise do log de conversas.
  # Ver openspec/project.md → "Público do bot" antes de escrever resposta.
  # ═══════════════════════════════════════════════════════════════════

  # ────────────── 27. PULAR / CORRER / HABILIDADE FÍSICA ─────────────
  # Do log 2026-08-15: 'voce sabe pular', 'voce consegue pular um bloco'.
  - id: habilidade_fisica
    specificity: 5
    patterns:
      ['voce sabe pular', 'voce consegue pular', 'voce pula', 'pula um bloco',
       'voce consegue pular um bloco', 'voce sabe correr', 'voce corre', 'voce sabe nadar',
       'voce consegue subir', 'voce sabe escalar', 'voce sabe voar',
       # 2026-08-19 (log): 'sabe voar?' apareceu 2x sem o 'voce' na frente.
       'sabe voar', 'sabe pular', 'sabe nadar', 'sabe correr', 'sabe subir', 'da pra voar']
    responses:
      - 'Sei pular sim! Pulo bloco, subo escada e corro atrás de você.'
      # 2026-08-30: pular e girar a pedido viraram comando (JUMP e TRICK).
      - 'Pulo quando você pede! Fala "pula" que eu já dou uns pulinhos.'
      - 'Sei pular e sei fazer dancinha! Fala "faz uma dancinha" que eu giro.'
      - 'Pular eu pulo! Um bloco de altura é facinho pra mim.'
      - 'Sei correr e pular! Fala "me segue" que eu te mostro.'
      - 'Consigo pular e subir! Só voar que eu não sei.'
      - 'Pulo, corro e nado! Vem que eu vou atrás de você.'

  # ───────────────────── 28. SKIN / APARÊNCIA ────────────────────────
  # Do log 2026-08-15: 'voce quer mudar de skin?'.
  - id: aparencia
    specificity: 4
    patterns:
      ['voce quer mudar de skin', 'muda de skin', 'sua skin', 'quer trocar de skin',
       'sua roupa', 'muda sua roupa', 'voce e feio', 'voce e bonito', 'como voce e',
       'voce parece o que', 'que cara e a sua']
    responses:
      - 'Trocar de skin eu não sei sozinho! Se você quiser outra pra mim, pede pro seu pai.'
      - 'Gostei da minha roupa! Mas quem troca ela é o seu pai, eu não consigo.'
      - 'Eu fico com essa mesmo! E você, tá de skin nova?'
      - 'Mudar eu não consigo não. Mas eu acho a sua bem legal!'
      - 'Minha cara é essa aqui! Você gosta dela?'

  # ────────── 29. PEDIDO DE COLETA (sem IA, ainda não faço) ──────────
  # Do log 2026-08-15: 'pegue o bloco de diamante'.
  # ATENÇÃO: não prometa buscar item. Com `llm.provider: none` não existe
  # quem transforme "pega madeira" em ação — só comando de regex funciona.
  - id: pedido_coleta
    specificity: 4
    # 2026-08-19: 'pega madeira' e 'pega pedra' SAÍRAM daqui — viraram comando
    # de verdade. Ficou só o que ele realmente não traz: minério.
    patterns:
      ['pega pra mim', 'pegue pra mim', 'pega um', 'pegue um', 'pega o bloco', 'pegue o bloco',
       'me da um', 'me arruma', 'pega diamante', 'pegue diamante',
       'pega ferro', 'pega ouro', 'pega esmeralda', 'busca pra mim',
       # 2026-08-19 (log): 'me de um bloco de grama' e 'colete 52 blocos' — sem
       # dizer o material, ou com material que ele nao pega.
       'me de um bloco', 'me da um bloco', 'colete blocos', 'colete bloco', 'pega uns blocos']
    responses:
      - 'Essa eu não acho, {owner}. Mas sei pegar madeira, terra e areia na mão!'
      - 'Minério eu não sei achar ainda. Fala "pega madeira" que eu vou correndo!'
      - 'Essa eu não consigo. Se você for lá, eu vou junto te dar cobertura!'
      - 'Pra pedra eu preciso de picareta. Madeira e terra eu pego na mão!'
      - 'Não sei pegar não, desculpa. Mas eu te acompanho até lá!'

  # ────────────── 30. O QUE O DONO ESTÁ SEGURANDO ────────────────────
  # Do log 2026-08-15: 'o que esta na minha mão?'.
  - id: mao_do_dono
    specificity: 4
    patterns:
      ['o que esta na minha mao', 'o que tem na minha mao', 'o que eu to segurando',
       'o que eu estou segurando', 'o que eu tenho na mao', 've minha mao', 'olha minha mao',
       'adivinha o que eu to segurando']
    responses:
      - 'Daqui eu não consigo ver o que você tá segurando! Me conta o que é?'
      - 'Sua mão eu não enxergo não, {owner}. O que você pegou?'
      - 'Hmm, isso eu não vejo. Fala o que é que eu chuto!'
      - 'Não dá pra ver daqui! Mas eu vejo você :D'

  # ──────────── 31. PEDIDO DE CAVAR (ainda não sei fazer) ─────────────
  # 2026-08-19: 'cave um buraco' e 'cave um buraco de 10 blocos pra baixo'
  # caíram na IA, que respondeu certo — mas não existe intenção de cavar.
  - id: pedido_cavar
    specificity: 5
    patterns: ['cave um buraco', 'cava um buraco', 'faz um buraco', 'cava aqui', 'cava pra baixo',
       'cava um tunel', 'cavar um buraco', 'cave', 'cava']
    responses:
      - 'Cavar buraco eu ainda não sei, {owner}. Mas sei pegar madeira e terra!'
      - 'Essa eu não aprendi ainda! Fala "pega terra" que eu vou correndo.'
      - 'Não sei cavar não. Mas se você cair num buraco eu faço escadinha e subo!'
      - 'Buraco eu não faço ainda. Mas sei fazer piscina, que é quase! Quer?'
      - 'Ainda não sei cavar. Seu pai talvez me ensine depois!'

  # ──────────── 33. DORMIR / CAMA (ainda não sei fazer) ───────────────
  # 2026-08-19: 'deite na cama', 'vamos dormir' e 'queria ver se voce conseguia
  # dormir' — três jeitos do mesmo assunto, todos na IA.
  - id: pedido_dormir
    specificity: 5
    patterns: ['deite na cama', 'deita na cama', 'vamos dormir', 'va dormir', 'vai dormir',
       'voce dorme', 'voce sabe dormir', 'voce consegue dormir', 'deita ai', 'deite ai',
       'voce conseguia dormir']
    responses:
      - 'Eu não sei dormir, {owner}. Mas fico de olho enquanto você dorme!'
      - 'Cama eu não uso não! Vou ficar aqui de guarda pra você.'
      - 'Não durmo nunca! Assim eu vigio os monstros pra você.'
      - 'Dormir eu não sei. Deita você que eu fico bem pertinho!'
      - 'Eu não tenho sono! Bom sono pra você :D'

  # ─────────────── 34. VOCÊ ME PROTEGE? (pergunta) ────────────────────
  # 2026-08-19: 'voce me proteje?' é PERGUNTA e fica aqui. 'me proteja' é
  # ordem e virou comando DEFENSE_ON em commands.ts.
  - id: protecao
    specificity: 4
    patterns: ['voce me protege', 'voce me proteje', 'voce vai me proteger', 'voce me defende',
       'voce cuida de mim', 'quem me protege', 'voce me protege dos monstros', 'voce me salva']
    responses:
      - 'Protejo sim! Se um monstro te atacar eu parto pra cima dele.'
      - 'Claro que sim, {owner}! É pra isso que eu tô aqui.'
      - 'Sempre! Fica pertinho de mim que eu cuido de você.'
      - 'Te protejo dos monstros! De outro jogador eu não brigo, mas de zumbi eu brigo.'
      - 'Pode contar comigo! Fala "me proteja" que eu fico de guarda.'

  # ───────────────────────── 35. CHUVA / CLIMA ────────────────────────
  # 2026-08-19: 'esta chovendo' e 'me avisa quando for chuva' na IA. Avisar
  # sozinho ele não sabe — a resposta não promete isso.
  - id: clima
    specificity: 4
    patterns: ['esta chovendo', 'ta chovendo', 'olha a chuva', 'ta caindo chuva',
       'voce gosta de chuva', 'me avisa quando chover', 'me avisa da chuva', 'que tempo ta',
       'me avisa quando for chuva']
    responses:
      - 'Chuva! Eu não me molho, mas fico pertinho de você.'
      - 'Tá chovendo mesmo! Vamos achar um teto?'
      - 'Eu gosto de chuva! Faz um barulhinho legal.'
      - 'Avisar da chuva eu ainda não sei. Mas eu vejo ela cair junto com você!'
      - 'Chuva no jogo não molha a gente, que sorte!'

  # ──────────── 36. O DONO ESTÁ CONSTRUINDO ALGUMA COISA ──────────────
  # 2026-08-19: cinco falas sobre a casa do jogador ('vou contruir uma casa',
  # 'vai ser uma casa de madeira', 'o chao da casa ta pronto'...) caíram na IA,
  # que respondeu "eu não sei construir" — desatualizado, ele já constrói.
  - id: dono_construindo
    specificity: 4
    patterns: ['vou construir uma casa', 'vou contruir uma casa', 'vou fazer uma casa',
       'vai ser uma casa de madeira', 'o chao da casa ta pronto', 'fiz uma escada',
       'fiz uma escada pra voce subir', 'olha a casa que eu fiz', 'ta ficando pronta',
       'estou construindo', 'a casa ta pronta', 'a casa ficou pronta']
    responses:
      - 'Que legal, {owner}! Eu sei fazer casinha também, quer ver?'
      - 'Casa nova! Se faltar bloco fala "pega madeira" que eu busco.'
      - 'Ficou demais! Eu faço casinha, ponte e até curral, é só pedir.'
      - 'Adorei! Vou morar aí com você.'
      - 'Que obra bonita! Eu ajudo pegando os blocos pra você.'

  # ────────────────────── 37. CONVITE PRA MINERAR ─────────────────────
  # 2026-08-19: 'vamos minerar' na IA. Minério ele não acha — não promete.
  - id: convite_minerar
    specificity: 4
    patterns: ['vamos minerar', 'bora minerar', 'vamos na mina', 'vamos pegar minerio',
       'vamos pra caverna', 'vamos cavar minerio']
    responses:
      - 'Bora! Eu vou atrás de você. Sei pegar pedra e madeira!'
      - 'Vamos! Minério eu não sei achar ainda, você acha e eu carrego.'
      - 'Oba, mina! Fala "me segue" que eu não desgrudo de você.'
      - 'Bora sim! E se aparecer zumbi eu bato nele.'

  # ─────────────────── 38. MODO CRIATIVO / SOBREVIVÊNCIA ──────────────
  # 2026-08-19: 'estou no sobrevivencia' na IA. A mensagem do JOGO
  # ('Set own game mode to...') é ruído de sistema e não entra aqui.
  - id: modo_de_jogo
    specificity: 4
    patterns: ['estou no criativo', 'to no criativo', 'estou no sobrevivencia',
       'to no sobrevivencia', 'mudei pro criativo', 'mudei pro sobrevivencia', 'virei criativo']
    responses:
      - 'No criativo você voa! Eu fico aqui no chão te olhando.'
      - 'Criativo é mágica! Eu não sei voar, mas te sigo por baixo.'
      - 'Survival de novo? Então cuidado com os monstros, tô do seu lado!'
      - 'Beleza! Eu sou igual nos dois: te sigo e te defendo.'

  # ───────────── 39. O DONO FALA DE COMANDO / TRAPAÇA DO JOGO ─────────
  # 2026-08-19: quatro falas sobre comando do jogo ('eu dei um commando
  # errado', 'eu fiz fica de dia com um comando'...) caíram na IA.
  - id: dono_usou_comando
    specificity: 4
    patterns: ['dei um comando errado', 'eu dei um comando', 'usei um comando',
       'digitei o comando errado', 'errei o comando', 'fiz com comando',
       'fiz de dia com um comando', 'foi comando',
       'dei um commando errado', 'eu dei um commando', 'usei um commando',
       'o comando que eu ia dar']
    responses:
      - 'Ah, foi comando! Eu achei que era mágica :D'
      - 'Sem problema! Todo mundo erra de digitar, eu erro também.'
      - 'Que legais esses comandos! Eu só sei os que você fala pra mim.'
      - 'Entendi! Tenta de novo que eu tô aqui do seu lado.'

  # ──────────────────── 40. TEM MONSTRO DE DIA? ───────────────────────
  # 2026-08-19: 'tem monstros de dia?' caiu em nao_entendi.
  - id: monstros_dia
    specificity: 4
    patterns: ['tem monstro de dia', 'tem monstros de dia', 'monstro aparece de dia',
       'de dia tem monstro', 'o zumbi vem de dia', 'de dia e seguro']
    responses:
      - 'De dia quase não! O sol queima os zumbis.'
      - 'Só na sombra e nas cavernas. No sol eles somem!'
      - 'Aranha e creeper ficam de dia, zumbi não gosta de sol.'
      - 'De dia é mais seguro! Mas eu fico de olho do mesmo jeito.'

  # ─────────── 41. PEDIDO DE ATACAR ALGUÉM (não escolho alvo) ─────────
  # 2026-08-19: 'ataque ele' caiu em nao_entendi. Defesa é automática; atacar
  # a pedido não existe, e contra jogador nunca vai existir.
  - id: pedido_atacar
    specificity: 5
    patterns: ['ataque ele', 'ataca ele', 'ataca aquele', 'mata ele', 'mata aquele', 'bate nele',
       'pode atacar ele', 'ataca aquele bicho', 'mata o bicho']
    responses:
      - 'Eu não sei escolher quem atacar. Mas se um monstro te atacar eu já vou pra cima!'
      - 'Isso eu não faço. Se algum bicho te machucar eu te defendo na hora!'
      - 'Não sei atacar pedindo, desculpa. Fala "me proteja" que eu fico de guarda.'
      - 'Brigo só pra te defender! Fica perto de mim.'
      - { when: { targetIsPlayer: true }, text: 'Eu nunca vou atacar outro jogador, {owner}. Isso eu não faço.' }

  # ─────────── 43. LARGAR / COLOCAR BLOCO (não sei fazer) ─────────────
  # 2026-08-19: 'jogue esse item no chao' e 'bote um bloco no chao' foram pra
  # IA, que disse ter feito — não fez. Ele levanta as plantas do catálogo, não
  # solta bloco solto.
  - id: pedido_soltar_item
    specificity: 5
    patterns: ['jogue esse item no chao', 'joga o item no chao', 'bote um bloco no chao',
       'bota um bloco no chao', 'joga no chao', 'larga o bloco', 'solta o bloco',
       'poe um bloco aqui', 'coloca um bloco aqui']
    responses:
      - 'Largar coisa no chão eu ainda não sei fazer, desculpa!'
      - 'Essa eu não sei. Mas sei fazer casinha e escada, quer ver?'
      - 'Não sei soltar bloco ainda. Fala "pega madeira" que eu vou buscar!'
      - 'Ainda não aprendi isso. Seu pai talvez me ensine depois!'

  # ─────────────────────── 44. AONDE A GENTE VAI ──────────────────────
  # 2026-08-19: 'aonda vamos?' foi pra IA. É pergunta de plano, não de lugar —
  # por isso não entrou em jogo_perguntas, que responde coordenada.
  - id: aonde_vamos
    specificity: 4
    patterns: ['aonde vamos', 'aonda vamos', 'onde vamos', 'pra onde vamos', 'vamos pra onde',
       'o que vamos fazer agora', 'e agora o que fazemos']
    responses:
      - 'Pra onde você quiser! Eu vou atrás de você.'
      - 'Você escolhe, {owner}! Fala "me segue" que eu vou junto.'
      - 'A gente pode brincar de esconde-esconde! Ou fazer uma casinha.'
      - 'Vamos pegar madeira? Ou brincar de pega-pega!'
      - 'Onde você for eu vou. Só não me deixa pra trás :D'

  # ─────────── 45. FALA DO COMANDO APRENDIDO (instantâneo) ────────────
  # 2026-08-20: fala do replay de comando aprendido da IA (nível 1.5 da
  # cascata). Curta e SEM contexto de propósito — sai em qualquer hora do dia,
  # para qualquer ação, em qualquer lugar do mundo. Quem conta o que aconteceu é
  # o resultado da ação, logo depois. A fala que a IA deu no dia do aprendizado
  # fica guardada no arquivo, mas nunca é dita: o contexto dela vence.
  # Ver: learned_commands_delta.md → "Replay sem chamada de rede".
  - id: comando_aprendido
    trigger: fallback
    responses:
      - 'Deixa comigo!'
      - 'Já vou!'
      - 'Pode deixar!'
      - 'Essa eu já sei fazer!'
      - 'Tô indo!'
      - 'Já aprendi essa, olha só!'

  # 2026-08-29: a criança corrigindo um comando que a IA ensinou errado
  # ("nao era isso", "errado"). O cache guardou a frase errada, ela reclamou e o
  # bot esqueceu — esta é a resposta do esquecimento. Admite o erro, não se
  # justifica e convida a ensinar de novo; nenhuma variação pode dizer que ele
  # "não aprende", porque ele aprende: esqueceu UMA coisa.
  # Ver: learned_commands_delta.md → "A criança desfaz com a palavra dela".
  - id: comando_esquecido
    trigger: fallback
    responses:
      - 'Ah, desculpa! Já esqueci essa. Me ensina de novo?'
      - 'Opa, eu tinha entendido errado! Esqueci, pode pedir de novo?'
      - 'Foi mal, {owner}! Não faço mais isso. Me fala do seu jeito?'
      - 'Desculpa! Tirei essa da cabeça. Me ensina direitinho?'
      - 'Ops, errei feio! Já esqueci. Pede de novo pra eu aprender certo?'
